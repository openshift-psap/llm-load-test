kind: Deployment
apiVersion: apps/v1
metadata:
  name: llm-load-test-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-load-test-exporter
  template:
    metadata:
      labels:
        app: llm-load-test-exporter
    spec:
      containers:
        - name: exporter
          image: quay.io/openshift-psap/llm-load-test-exporter:latest
          imagePullPolicy: Always
          ports:
            - name: web
              containerPort: 8080
          volumeMounts:
            - name: shared-data
              mountPath: /shared_data
          envFrom:
            - configMapRef:
                name: llm-load-test-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: web
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: web
            initialDelaySeconds: 5
            periodSeconds: 10
        - name: runner
          image: quay.io/openshift-psap/llm-load-test-runner:latest
          imagePullPolicy: Always
          volumeMounts:
            - name: shared-data
              mountPath: /shared_data
          envFrom:
            - configMapRef:
                name: llm-load-test-config
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      serviceAccountName: llm-load-test-sa
      volumes:
        - name: shared-data
          emptyDir: {}
